name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Linux build libraries for xcap (package list not yet proven on a runner)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libwayland-dev libpipewire-0.3-dev libspa-0.2-dev libxcb1-dev libxcb-randr0-dev libdbus-1-dev libegl-dev libgbm-dev xvfb
      - name: cargo deny (licenses, bans, sources)
        if: runner.os == 'Linux'
        run: cargo install cargo-deny --locked --version 0.19.9 && cargo deny check licenses bans sources
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --no-fail-fast
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build -p fs-capture-cli
      - name: Run the real binary (capture attempt; the exact result is the finding)
        continue-on-error: true
        shell: bash
        env:
          RUN: ${{ runner.os == 'Linux' && 'xvfb-run -a target/debug/fs-capture' || 'target/debug/fs-capture' }}
        run: |
          mkdir -p evidence
          $RUN screens > evidence/screens.txt 2>&1 && echo "exit=0" >> evidence/screens.txt || echo "exit=$?" >> evidence/screens.txt
          $RUN windows > evidence/windows.txt 2>&1 && echo "exit=0" >> evidence/windows.txt || echo "exit=$?" >> evidence/windows.txt
          $RUN shot --primary --dir evidence/out > evidence/shot.txt 2>&1 && echo "exit=0" >> evidence/shot.txt || echo "exit=$?" >> evidence/shot.txt
          $RUN zip evidence/out.zip --dir evidence/out > evidence/zip.txt 2>&1 && echo "exit=0" >> evidence/zip.txt || echo "exit=$?" >> evidence/zip.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: capture-evidence-${{ runner.os }}
          path: evidence
          if-no-files-found: warn
