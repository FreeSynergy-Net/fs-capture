[package]
name = "fs-capture-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Command line for fs-capture: screenshots of screens and windows, collected in a folder and bundled as ZIP. Built with help from Claude (AI)."

[[bin]]
name = "fs-capture"
path = "src/main.rs"

[features]
default = ["xcap"]
xcap = ["fs-capture/xcap"]

[dependencies]
fs-capture = { path = "../fs-capture", default-features = false }

[dev-dependencies]
tempfile = "3"
